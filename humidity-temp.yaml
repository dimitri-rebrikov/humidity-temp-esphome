# =============================================================================
# humidity-temp.yaml - temperature / humidity / ambient light display node
# =============================================================================
#
#   MCU     : ESP8266 (Wemos D1 Mini, 30-pin, 4 MB flash, CH340 USB)
#             For ESP32 replace the "esp8266:" block with
#                 esp32:
#                   board: esp32dev
#             and pick free I2C pins (the D1/D2 aliases below are ESP8266 only).
#   Sensors : AHT20  temperature + relative humidity, I2C 0x38
#             BH1750 illuminance,                    I2C 0x23
#   Display : TM1637 4-digit 7-segment, 2-dot colon between the digit pairs
#
# Display layout:      [T][T]  :  [H][H]
#                    temperature   humidity in %RH      (rounded to integers)
#
# Behaviour, MQTT topics, wiring and troubleshooting: see README.md.
# =============================================================================

substitutions:
  device_name: humidity-temp
  friendly_name: "Humidity Temp Monitor"

  # Display refresh. Every refresh re-renders and bit-bangs the whole display,
  # which blocks for roughly 10 ms - do not go much below 250 ms.
  display_update_ms: "250"

  # The colon has two dots. They blink alternately: exactly one dot is lit at
  # any time, and the two swap every colon_blink_period_ms.
  colon_blink_period_ms: "800"

  # The humidity digits blink while the humidity is outside the comfort band.
  humidity_blink_period_ms: "800"

  # Which digit's decimal-point bit drives the colon. Indices are 0-based,
  # 0 = leftmost digit.
  # Measured on the reference module: index 1 lights BOTH colon dots. They share
  # a single decimal-point line, so they can only be switched on and off
  # together - steering them separately is not possible on this hardware.
  # Re-measure with colon_diagnostic below after swapping the display.
  colon_dot_digit: "1"

  # Colon pattern:
  #   0 = both dots permanently on
  #   1 = both dots blink with colon_blink_period_ms
  colon_mode: "1"

  # Calibration helper. While "true" the display ignores temperature and
  # humidity. For 2 s per step it shows a digit that names the decimal-point
  # index currently being lit: "1" -> index 0, "2" -> index 1, "3" -> index 2,
  # "4" -> index 3.
  colon_diagnostic: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini
  # Default is false -> restored values live in RTC memory, which survives a
  # reboot/deep-sleep but NOT a real power cut. Switching the module off made
  # every number (offsets, comfort band, dim curve) fall back to initial_value.
  # With this enabled the preferences are written to flash and survive both.
  # Flash is only written when a value actually changes, so wear stays low.
  restore_from_flash: true

# -----------------------------------------------------------------------------
# Connectivity
# -----------------------------------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Fallback access point. Together with captive_portal this lets you reach
  # http://192.168.4.1 and reconfigure WiFi when the network is unavailable.
  ap:
    ssid: "Humidity Temp Fallback"
    password: !secret ota_password

captive_portal:

# Native ESPHome API (Home Assistant integration alongside MQTT).
api:
  encryption:
    key: !secret esphome_api_key

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: ${device_name}

# Raise to DEBUG to see the auto-dimming decisions on the serial/OTA log.
logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

# -----------------------------------------------------------------------------
# I2C bus - shared by the AHT20 and the BH1750
# -----------------------------------------------------------------------------

i2c:
  sda: GPIO4  # D2
  scl: GPIO5  # D1
  scan: true
  # Both sensors are specified for 400 kHz. If the readings turn out flaky
  # (long wires, weak pull-ups), drop this to 10kHz.
  frequency: 100kHz

# -----------------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------------

sensor:
  - platform: aht10
    variant: AHT20
    update_interval: 10s
    temperature:
      name: "Temperature"
      id: temperature
      # Calibration offset, adjustable over MQTT. Applied here rather than in the
      # display so the panel, the MQTT state and Home Assistant all report the
      # same corrected value. A new offset takes effect on the next sensor
      # update (10 s), not instantly.
      filters:
        - offset: !lambda |-
            return id(temperature_offset).state;
    humidity:
      name: "Humidity"
      id: humidity

  - platform: bh1750
    name: "Illuminance"
    id: illuminance
    update_interval: 10s

  # The TM1637 brightness the auto-dimming currently applies, 0 (darkest) to
  # 7 (brightest). Computed and published from the display lambda, so this
  # entity never polls on its own.
  - platform: template
    name: "Display Brightness"
    id: display_brightness
    update_interval: never
    accuracy_decimals: 0

# -----------------------------------------------------------------------------
# Runtime configuration (all values are restored across reboots)
# -----------------------------------------------------------------------------

number:
  # Temperature calibration offset in °C, added to the AHT20 reading.
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    mode: BOX

  # Comfort band. Humidity outside [min, max] makes the humidity digits blink
  # and clears the "Humidity In Comfort Range" binary sensor.
  - platform: template
    name: "Humidity Min"
    id: humidity_min
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: BOX

  - platform: template
    name: "Humidity Max"
    id: humidity_max
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: BOX

  # Auto-dimming curve:
  #   intensity = min + (7 - min) * clamp((lux - low) / (high - low), 0 .. 1) ^ gamma
  # Intensity 0..7 selects the TM1637 pulse width:
  #   0 = 1/16, 1 = 2/16, 2 = 4/16, 3 = 10/16, 4 = 11/16, 5 = 12/16,
  #   6 = 13/16, 7 = 14/16
  # 0 is a real brightness level - the dimmest visible duty - not "off".
  # Setting "Dim Lux High" <= "Dim Lux Low" forces full brightness.
  - platform: template
    name: "Dim Lux Low"
    id: dim_lux_low
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "lx"
    mode: BOX

  - platform: template
    name: "Dim Lux High"
    id: dim_lux_high
    optimistic: true
    restore_value: true
    initial_value: 300
    min_value: 10
    max_value: 2000
    step: 10
    unit_of_measurement: "lx"
    mode: BOX

  # Curve coefficient. 1.0 = linear, > 1 dims earlier, < 1 brightens earlier.
  - platform: template
    name: "Dim Gamma"
    id: dim_gamma
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.2
    max_value: 3.0
    step: 0.1
    mode: BOX

  # Brightness reached in a fully dark room, 0..7. 1 keeps the display softly
  # visible; 0 uses the dimmest duty (1/16), which is almost dark in daylight
  # but still readable at night. It does not switch the display off.
  - platform: template
    name: "Dim Min Intensity"
    id: dim_min_intensity
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 7
    step: 1
    mode: BOX

# -----------------------------------------------------------------------------
# Comfort state (publish-only, driven from the display lambda)
# -----------------------------------------------------------------------------

binary_sensor:
  - platform: template
    name: "Humidity In Comfort Range"
    id: humidity_in_comfort_range

# -----------------------------------------------------------------------------
# TM1637 4-digit display
# -----------------------------------------------------------------------------

display:
  - platform: tm1637
    id: tm_display
    clk_pin: D6  # GPIO12
    dio_pin: D5  # GPIO14
    update_interval: ${display_update_ms}ms
    lambda: |-
      // -----------------------------------------------------------------------
      // 7-segment glyphs.
      //
      // Written as raw bytes through it.set_buffer() so that every digit *and*
      // every decimal point is controlled separately. set_buffer() needs
      // ESPHome >= 2026.4 (it is not available in older releases).
      //
      // TM1637 raw byte layout for a non-inverted display:
      //     bit0=A bit1=B bit2=C bit3=D bit4=E bit5=F bit6=G bit7=decimal point
      // -----------------------------------------------------------------------
      static const uint8_t SEG_DIGIT[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66,
                                            0x6D, 0x7D, 0x07, 0x7F, 0x6F};
      static const uint8_t SEG_BLANK = 0x00;    // nothing
      static const uint8_t SEG_MINUS = 0x40;    // '-'
      static const uint8_t SEG_H = 0x76;        // 'H'
      static const uint8_t SEG_I = 0x06;        // 'I'
      static const uint8_t SEG_L = 0x38;        // 'L'
      static const uint8_t SEG_O = 0x3F;        // 'O'
      static const uint8_t SEG_UNKNOWN = 0x40;  // '-' while a value is unavailable

      static const uint32_t COLON_PERIOD_MS = ${colon_blink_period_ms};
      static const uint32_t HUMIDITY_PERIOD_MS = ${humidity_blink_period_ms};

      // Colon: 0 = both dots permanently on, 1 = both dots blinking.
      static const int COLON_MODE = ${colon_mode};
      static const bool COLON_DIAGNOSTIC = ${colon_diagnostic};

      uint8_t buf[4] = {SEG_BLANK, SEG_BLANK, SEG_BLANK, SEG_BLANK};

      // ---- digits 1-2: temperature ------------------------------------------
      // NOTE: local names must not collide with ESPHome entity IDs, otherwise
      // the generated "temperature->state" lookup would resolve to the local.
      const float temp_c = id(temperature).state;
      if (std::isnan(temp_c)) {
        buf[0] = SEG_UNKNOWN;
        buf[1] = SEG_UNKNOWN;
      } else {
        const int value = (int) (temp_c < 0 ? temp_c - 0.5f : temp_c + 0.5f);
        if (value > 99) {
          buf[0] = SEG_H;
          buf[1] = SEG_I;
        } else if (value < -9) {
          buf[0] = SEG_L;
          buf[1] = SEG_O;
        } else if (value < 0) {
          buf[0] = SEG_MINUS;
          buf[1] = SEG_DIGIT[-value];
        } else {
          buf[0] = SEG_DIGIT[value / 10];
          buf[1] = SEG_DIGIT[value % 10];
        }
      }

      // ---- digits 3-4: relative humidity ------------------------------------
      const float rh = id(humidity).state;
      const bool rh_valid = !std::isnan(rh);
      if (rh_valid) {
        int value = (int) (rh + 0.5f);
        if (value < 0) {
          value = 0;  // keep the SEG_DIGIT index in range
        }
        if (value > 99) {
          buf[2] = SEG_H;
          buf[3] = SEG_I;
        } else {
          buf[2] = SEG_DIGIT[value / 10];
          buf[3] = SEG_DIGIT[value % 10];
        }
      }

      // ---- comfort band -----------------------------------------------------
      // Nothing is published until the first valid reading, so Home Assistant
      // shows "unknown" instead of a spurious "off".
      if (rh_valid) {
        const bool in_comfort = rh >= id(humidity_min).state && rh <= id(humidity_max).state;
        id(humidity_in_comfort_range).publish_state(in_comfort);

        // Outside the band the humidity digits blink - slow, and only during
        // the dark half of the period. The temperature digits stay readable.
        if (!in_comfort && ((millis() / HUMIDITY_PERIOD_MS) % 2) == 1) {
          buf[2] = SEG_BLANK;
          buf[3] = SEG_BLANK;
        }
      }

      // ---- colon -----------------------------------------------------------
      // Applied after the blink, so a blanked humidity digit still leaves the
      // colon lit (the colon LEDs and the digit segments are separate).
      // On the reference module both dots hang on COLON_DOT_DIGIT's decimal
      // point line, so they always switch together. A module that exposes the
      // two dots on two separate lines could light one per phase instead.
      if (COLON_MODE == 0 || ((millis() / COLON_PERIOD_MS) % 2) == 0) {
        buf[${colon_dot_digit}] |= 0x80;
      }

      // ---- auto-dimming from the BH1750 ------------------------------------
      // The tuning inputs are sanitised first. Without this a parameter that is
      // still NaN (or nonsense) falls through to "full brightness" and looks
      // like the display ignoring every setting, with no hint why.
      float lux_low = id(dim_lux_low).state;
      float lux_high = id(dim_lux_high).state;
      float gamma = id(dim_gamma).state;
      int min_level = (int) id(dim_min_intensity).state;

      if (std::isnan(lux_low)) {
        lux_low = 10.0f;
      }
      if (std::isnan(lux_high)) {
        lux_high = 300.0f;
      }
      if (std::isnan(gamma) || gamma <= 0.0f) {
        gamma = 1.0f;
      }
      if (min_level < 0) {
        min_level = 0;
      } else if (min_level > 7) {
        min_level = 7;
      }

      const float lux = id(illuminance).state;
      if (!std::isnan(lux)) {
        // lux_high <= lux_low is a deliberate escape hatch: full brightness at
        // any light level.
        float factor = 1.0f;
        if (lux_high > lux_low) {
          factor = (lux - lux_low) / (lux_high - lux_low);
          if (factor < 0.0f) {
            factor = 0.0f;
          } else if (factor > 1.0f) {
            factor = 1.0f;
          }
        }

        float curve = std::pow(factor, gamma);
        if (!(curve >= 0.0f && curve <= 1.0f)) {  // also catches NaN
          curve = 1.0f;
        }

        int intensity = (int) (min_level + (7 - min_level) * curve + 0.5f);
        if (intensity < 0) {
          intensity = 0;
        } else if (intensity > 7) {
          intensity = 7;
        }
        it.set_intensity((uint8_t) intensity);

        // Report only when the brightness changes. A sensor does not
        // de-duplicate, the display refreshes 4 times a second, and the log
        // line at INFO is the only way to see why a level was chosen.
        static int8_t last_intensity = -1;
        if ((int8_t) intensity != last_intensity) {
          last_intensity = (int8_t) intensity;
          id(display_brightness).publish_state((float) intensity);
          ESP_LOGI("humidity_temp",
                   "Display intensity %d (%.1f lx, lux_low %.0f, lux_high %.0f, gamma %.2f, min %d)",
                   intensity, lux, lux_low, lux_high, gamma, min_level);
        }
      } else {
        static bool warned_missing_lux = false;
        if (!warned_missing_lux) {
          warned_missing_lux = true;
          ESP_LOGW("humidity_temp", "Auto-dim idle: no illuminance reading, keeping the boot brightness");
        }
      }

      // ---- calibration helper ----------------------------------------------
      // Overrides everything above. The leftmost digit names the decimal-point
      // index that is currently lit, 2 s per step:
      //     shows "1" -> index 0, "2" -> index 1, "3" -> index 2, "4" -> index 3
      // Watch which LED lights up while each digit is displayed, then set
      // colon_dot_digit and colon_diagnostic: "false".
      if (COLON_DIAGNOSTIC) {
        const uint8_t probe = (millis() / 2000) % 4;
        buf[0] = SEG_DIGIT[probe + 1];
        buf[1] = SEG_BLANK;
        buf[2] = SEG_BLANK;
        buf[3] = SEG_BLANK;
        buf[probe] |= 0x80;
      }

      it.set_buffer(buf, 4);
